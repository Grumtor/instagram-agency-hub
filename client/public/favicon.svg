<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="url(#grad)"/>
  <!-- Camera body -->
  <rect x="5" y="10" width="22" height="15" rx="3" fill="white" opacity="0.9"/>
  <!-- Camera lens outer ring -->
  <circle cx="16" cy="17.5" r="5" fill="url(#grad)"/>
  <!-- Camera lens inner -->
  <circle cx="16" cy="17.5" r="3" fill="white" opacity="0.85"/>
  <!-- Viewfinder bump -->
  <rect x="12" y="7" width="8" height="4" rx="2" fill="white" opacity="0.9"/>
  <!-- Flash dot -->
  <circle cx="23" cy="13" r="1.5" fill="url(#grad)"/>
</svg>
